               /* Integer truncation of fractional values matches SDL_uikitmetalview and
          EOF_FILE_3
          cat > ios-legacy/host/ios_diag.mm <<'EOF_FILE_4'
          // ios_diag.mm - persistent log + crash/exception diagnostics for the iOS 7+ armv7 build.
          // Everything goes to <App>/Documents/cnc_ios.log (visible via iTunes file sharing / SSH):
          // SDL_Log output, fatal signals with a backtrace, uncaught NSException / std::terminate, heartbeat.
          // Adapted from the Unreal iOS legacy port.
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <SDL.h>
          #include <execinfo.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>
          #include <exception>

          static int GFd = -1;
          static pthread_mutex_t GLock = PTHREAD_MUTEX_INITIALIZER;
          static char GLast[256] = "(nothing logged yet)";
          static char GPath[1100];

          static void RawWrite(const char *s)
          {
          	if (GFd < 0 || !s) return;
          	size_t n = strlen(s);
          	while (n) {
          		ssize_t w = write(GFd, s, n);
          		if (w <= 0) break;
          		s += w; n -= (size_t)w;
          	}
          }

          static void EnsureOpen(void)
          {
          	if (GFd >= 0) return;
          	const char *home = getenv("HOME");
          	snprintf(GPath, sizeof(GPath), "%s/Documents/cnc_ios.log", home ? home : ".");
          	GFd = open(GPath, O_WRONLY | O_CREAT | O_APPEND, 0644);
          }

          static void LogLine(const char *msg, bool update_last)
          {
          	if (!msg) return;
          	pthread_mutex_lock(&GLock);
          	EnsureOpen();
          	char line[1400], ts[16];
          	time_t now = time(NULL); struct tm tmv; localtime_r(&now, &tmv);
          	strftime(ts, sizeof(ts), "%H:%M:%S", &tmv);
          	snprintf(line, sizeof(line), "[%s] %.1300s\n", ts, msg);
          	RawWrite(line);
          	if (update_last) strlcpy(GLast, msg, sizeof(GLast));
          	pthread_mutex_unlock(&GLock);
          }

          static void CrashHandler(int sig, siginfo_t *si, void *)
          {
          	char b[400];
          	snprintf(b, sizeof(b), "\n*** CRASH: signal %d (%s) fault addr=%p\n*** last log line: %s\n",
          		sig, strsignal(sig), si ? si->si_addr : NULL, GLast);
          	RawWrite(b);
          	void *bt[64]; int n = backtrace(bt, 64);
          	if (GFd >= 0) backtrace_symbols_fd(bt, n, GFd);
          	RawWrite("*** end of crash report\n");
          	signal(sig, SIG_DFL);
          	raise(sig);
          }

          static void TerminateHandler(void)
          {
          	static int busy = 0;
          	if (!busy) {
          		busy = 1;
          		char b[600];
          		try { throw; }
          		catch (const std::exception &e) { snprintf(b, sizeof(b), "std::exception: %s", e.what()); }
          		catch (const char *s) { snprintf(b, sizeof(b), "thrown const char*: %s", s ? s : "(null)"); }
          		catch (int i) { snprintf(b, sizeof(b), "thrown int: %d", i); }
          		catch (...) { snprintf(b, sizeof(b), "unknown exception"); }
          		char m[800];
          		snprintf(m, sizeof(m), "*** std::terminate: %s | last log line: %s", b, GLast);
          		LogLine(m, false);
          		void *bt[64]; int n = backtrace(bt, 64);
          		if (GFd >= 0) backtrace_symbols_fd(bt, n, GFd);
          	}
          	abort();
          }

          static void ObjCExceptionHandler(NSException *e)
          {
          	NSString *s = [NSString stringWithFormat:@"*** Uncaught NSException %@: %@\n%@", e.name, e.reason, [e callStackSymbols]];
          	LogLine([s UTF8String], false);
          }

          static void SDLCALL SDLLogCB(void *, int cat, SDL_LogPriority pri, const char *msg)
          {
          	char b[1100];
          	snprintf(b, sizeof(b), "SDL[cat=%d pri=%d]: %s", cat, (int)pri, msg ? msg : "");
          	LogLine(b, true);
          }

          static void *HeartbeatThread(void *)
          {
          	int t = 0;
          	for (;;) {
          		sleep(t < 60 ? 5 : 30);
          		t += (t < 60 ? 5 : 30);
          		char b[400];
          		snprintf(b, sizeof(b), "heartbeat +%ds | last log line: %s", t, GLast);
          		LogLine(b, false);
          	}
          	return NULL;
          }

          __attribute__((constructor)) static void CncIOSDiagInit(void)
          {
          	@autoreleasepool {
          		char h[300];
          		snprintf(h, sizeof(h), "\n==== C&C iOS legacy launch | build %s %s | iOS %s | %s ====",
          			__DATE__, __TIME__, [[[UIDevice currentDevice] systemVersion] UTF8String],
          			[[[UIDevice currentDevice] model] UTF8String]);
          		LogLine(h, true);
          	}
          	static char altstack[64 * 1024];
          	stack_t ss; ss.ss_sp = altstack; ss.ss_size = sizeof(altstack); ss.ss_flags = 0;
          	sigaltstack(&ss, NULL);
          	struct sigaction sa; memset(&sa, 0, sizeof(sa));
          	sa.sa_sigaction = CrashHandler;
          	sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESETHAND;
          	sigemptyset(&sa.sa_mask);
          	const int sigs[] = { SIGSEGV, SIGBUS, SIGILL, SIGABRT, SIGFPE, SIGTRAP };
          	for (size_t i = 0; i < sizeof(sigs) / sizeof(sigs[0]); i++) sigaction(sigs[i], &sa, NULL);
          	std::set_terminate(TerminateHandler);
          	NSSetUncaughtExceptionHandler(&ObjCExceptionHandler);
          	SDL_LogSetAllPriority(SDL_LOG_PRIORITY_INFO);
          	SDL_LogSetOutputFunction(SDLLogCB, NULL);
          	pthread_t th;
          	if (pthread_create(&th, NULL, HeartbeatThread, NULL) == 0) pthread_detach(th);
          	LogLine("diag: crash/exception/SDL handlers + heartbeat installed", true);
          }
          EOF_FILE_4
          cat > ios-legacy/host/ios_availability_stub.m <<'EOF_FILE_5'
          /*
           * ___isPlatformVersionAtLeast is a compiler-rt builtin clang emits for
           * @available(...)/API_AVAILABLE checks. This toolchain's prebuilt
           * libSDL2.a was compiled against a clang that assumes it's always
           * present at link time (normally supplied by Apple's compiler-rt on a
           * real Xcode toolchain), but this bare Linux->iOS cross-toolchain
           * doesn't ship a compiler-rt archive at all - so the symbol is simply
           * never linked in.
           *
           * Both call sites that need it (SDL_HideHomeIndicatorHintChanged and
           * UIKit_ShowMessageBoxAlertController, both in SDL2's UIKit backend)
           * only use it to guard iOS 11+/13+ API calls. Since this whole build
           * targets iPhoneOS 9.3, any real OS this binary ever runs on that is
           * newer than 9.3 should still report "yes, at least" for those
           * checks correctly - so a full platform/version parser isn't needed,
           * just something that answers consistently with the real runtime
           * version already available via -[UIDevice systemVersion].
           *
           * Clang's ABI for this builtin (see clang/lib/CodeGen/CGObjC.cpp,
           * EmitAvailabilityCheck): int32_t platform, then three components
           * (major, minor, subminor) of the version being checked against.
           * Returning 1 when the running OS's version >= the requested version
           * matches real semantics; the SDL call sites already gate their own
           * logic on this, so this stub just needs to answer correctly rather
           * than unconditionally return true.
           */
          #import <UIKit/UIKit.h>

          int32_t __isPlatformVersionAtLeast(int32_t platform, int32_t major, int32_t minor, int32_t subminor) {
              (void)platform; /* single-platform (iOS) build; ignore platform id */

              NSString *sysVersion = [[UIDevice currentDevice] systemVersion];
              NSArray<NSString *> *parts = [sysVersion componentsSeparatedByString:@"."];

              int32_t runningMajor = parts.count > 0 ? [parts[0] intValue] : 0;
              int32_t runningMinor = parts.count > 1 ? [parts[1] intValue] : 0;
              int32_t runningSubminor = parts.count > 2 ? [parts[2] intValue] : 0;

              if (runningMajor != major) return runningMajor > major;
              if (runningMinor != minor) return runningMinor > minor;
              return runningSubminor >= subminor;
          }
          EOF_FILE_5
          cat > ios-legacy/resources/Info.plist <<'EOF_FILE_6'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key><string>en</string>
          	<key>CFBundleExecutable</key><string>CommandConquer</string>
          	<key>CFBundleIdentifier</key><string>com.cncport.cnc.armv7</string>
          	<key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          	<key>CFBundleName</key><string>C&amp;C</string>
          	<key>CFBundleDisplayName</key><string>C&amp;C</string>
          	<key>CFBundlePackageType</key><string>APPL</string>
          	<key>CFBundleShortVersionString</key><string>0.1.0</string>
          	<key>CFBundleVersion</key><string>1</string>
          	<key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
          	<key>MinimumOSVersion</key><string>7.0</string>
          	<key>LSRequiresIPhoneOS</key><true/>
          	<key>UIRequiredDeviceCapabilities</key><array><string>armv7</string><string>opengles-2</string></array>
          	<key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          	<key>CFBundleIconFiles</key><array><string>Icon-60@2x.png</string><string>Icon-76.png</string><string>Icon-76@2x.png</string></array>
          	<key>UIPrerenderedIcon</key><true/>
          	<key>UISupportedInterfaceOrientations</key>
          	<array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          	<key>UISupportedInterfaceOrientations~ipad</key>
          	<array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          	<key>UIStatusBarHidden</key><true/>
          	<key>UIViewControllerBasedStatusBarAppearance</key><false/>
          	<key>UIRequiresFullScreen</key><true/>
          	<key>UIFileSharingEnabled</key><true/>
          </dict>
          </plist>
          EOF_FILE_6
          cat > ios-legacy/resources/entitlements.plist <<'EOF_FILE_7'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>get-task-allow</key>
          	<true/>
          </dict>
          </plist>
          EOF_FILE_7
          cat > ios-legacy/scripts/fetch_sdl.sh <<'EOF_FILE_8'
          #!/usr/bin/env bash
          # Fetch SDL 2.32.10 into ios-legacy/third_party/SDL and apply the iOS 7 / SDK 9.3 patch.
          # Usage: fetch_sdl.sh [path/to/SDL2-2.32.10.tar.gz]   (downloads if no tarball is given)
          set -euo pipefail
          R="$(cd "$(dirname "$0")/.." && pwd)"
          VER=2.32.10
          DEST="$R/third_party/SDL"
          TAR="${1:-$R/third_party/SDL2-$VER.tar.gz}"
          mkdir -p "$R/third_party"
          if [ ! -f "$TAR" ]; then
            curl -fL "https://github.com/libsdl-org/SDL/releases/download/release-$VER/SDL2-$VER.tar.gz" -o "$TAR"
          fi
          rm -rf "$DEST" "$R/third_party/SDL2-$VER"
          tar -xzf "$TAR" -C "$R/third_party"
          mv "$R/third_party/SDL2-$VER" "$DEST"
          patch -d "$DEST" -p1 < "$R/patches/sdl2-ios7.patch"
          echo "SDL $VER ready (iOS 7 patch applied) at $DEST"
          EOF_FILE_8
          cat > ios-legacy/scripts/package_ios.sh <<'EOF_FILE_9'
          #!/usr/bin/env bash
          # Usage: package_ios.sh <build-dir> [out-dir] [--assets DIR]
          # -> <out>/CommandConquer.ipa (ldid fake-signed; for jailbroken / sideloaded iOS 7+ armv7 devices)
          # --assets DIR  bundles DIR as app/assets/cnc (needs gdi/INSTALL/CONQUER.INI inside). Large! Without it,
          #               copy the data into the app's Documents folder instead (see README).
          set -euo pipefail
          B="${1:?build dir}"; shift
          OUT="$B/out"; ASSETS=""
          if [ $# -gt 0 ] && [ "${1#--}" = "$1" ]; then OUT="$1"; shift; fi
          while [ $# -gt 0 ]; do case "$1" in --assets) ASSETS="${2:?}"; shift 2;; *) echo "bad arg $1"; exit 2;; esac; done
          R="$(cd "$(dirname "$0")/.." && pwd)"
          BIN="$B/CommandConquer"; [ -f "$BIN" ] || { echo "no $BIN"; exit 1; }
          rm -rf "$OUT/Payload"; APP="$OUT/Payload/CommandConquer.app"; mkdir -p "$APP"
          cp "$BIN" "$APP/CommandConquer"
          cp "$R/resources/Info.plist" "$APP/"
          find "$R/resources" -maxdepth 1 -name '*.png' -exec cp {} "$APP/" \;
          if [ -n "$ASSETS" ]; then
            [ -f "$ASSETS/gdi/INSTALL/CONQUER.INI" ] || { echo "$ASSETS/gdi/INSTALL/CONQUER.INI missing"; exit 1; }
            mkdir -p "$APP/assets"; cp -r "$ASSETS" "$APP/assets/cnc"
          fi
          LDID="${LDID:-$(command -v ldid || ls ${THEOS:-/nonexistent}/toolchain/linux/iphone/bin/ldid 2>/dev/null || true)}"
          if [ -n "$LDID" ]; then "$LDID" -S"$R/resources/entitlements.plist" "$APP/CommandConquer"; else echo "warning: ldid not found, binary unsigned"; fi
          (cd "$OUT" && rm -f CommandConquer.ipa && zip -qr CommandConquer.ipa Payload)
          echo "built $OUT/CommandConquer.ipa"
          EOF_FILE_9
          cat > ios-legacy/scripts/gen_resources.py <<'EOF_FILE_10'
          #!/usr/bin/env python3
          """Generate placeholder icons and black launch images (pure stdlib). Run once; PNGs are committed."""
          import struct, zlib, sys, os
          def png(path, w, h, px):
              raw = b"".join(b"\x00" + b"".join(bytes(px(x, y)) for x in range(w)) for y in range(h))
              def ch(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              open(path, "wb").write(b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw, 9)) + ch(b"IEND", b""))
          def icon(s):
              def px(x, y):
                  b = max(1, s // 16)
                  if x < b or y < b or x >= s - b or y >= s - b: return (200, 160, 40)
                  if s * 3 // 8 < y < s * 5 // 8 and s // 6 < x < s * 5 // 6: return (200, 160, 40)   # gold bar
                  return (30 + 60 * y // s, 12, 12)
              return px
          out = sys.argv[1]
          for n, s in (("Icon-60@2x.png", 120), ("Icon-76.png", 76), ("Icon-76@2x.png", 152)):
              png(os.path.join(out, n), s, s, icon(s))
          black = lambda x, y: (0, 0, 0)
          for n, w, h in (("Default@2x.png", 640, 960), ("Default-568h@2x.png", 640, 1136),
                          ("Default-Landscape~ipad.png", 1024, 748), ("Default-Landscape@2x~ipad.png", 2048, 1496)):
              png(os.path.join(out, n), w, h, black)
          EOF_FILE_10
          chmod +x ios-legacy/scripts/*.sh ios-legacy/scripts/gen_resources.py
          python3 -I ios-legacy/scripts/gen_resources.py ios-legacy/resources
          python3 - <<'EOF_PY'
          p = "PORT/IOS/src/ios_main.cpp"
          t = open(p).read()
          if "RA_IOS_LEGACY" not in t:
              old = "static void select_resource_root(void)\n{\n"
              new = old + """#if defined(RA_IOS_LEGACY)
          \t/* iOS 7 build: game data lives in the app's Documents folder (iTunes file sharing / SSH):
          \t * Documents/assets/cnc/... or Documents/cnc-root/assets/cnc/... */
          \t{
          \t\tchar const *home = getenv("HOME");
          \t\tif (home && home[0]) {
          \t\t\tstd::string docs = join_path(home, "Documents");
          \t\t\tif (use_resource_root(docs) || use_resource_root(join_path(docs, "cnc-root"))) {
          \t\t\t\treturn;
          \t\t\t}
          \t\t}
          \t}
          #endif
          """
              assert old in t
              t = t.replace(old, new, 1)
              t = t.replace("#include <limits.h>\n", "#include <limits.h>\n#include <stdlib.h>\n", 1)
              open(p, "w").write(t)
          print("ios_main.cpp patched")
          EOF_PY

      - name: Theos + toolchain + iPhoneOS 9.3 SDK
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          curl -fsSL -o /tmp/sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            [ -f "$fw/module.map" ] && { mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; }
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done
          TB="$THEOS/toolchain/linux/iphone/bin"
          [ -e "$TB/aarch64-apple-darwin14-ranlib" ] || ln -sf "$TB/llvm-ranlib" "$TB/aarch64-apple-darwin14-ranlib" 2>/dev/null || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Fetch + patch SDL2
        run: ios-legacy/scripts/fetch_sdl.sh
      - name: Configure
        run: |
          set -o pipefail
          command -v ninja && ninja --version
          # absolute path: with -S ios-legacy a relative toolchain path is resolved inside ios-legacy/
          cmake -S "$GITHUB_WORKSPACE/ios-legacy" -B "$GITHUB_WORKSPACE/build" -G Ninja -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-legacy/cmake/ios-armv7-toolchain.cmake" 2>&1 | tee build-configure.log || {
            tail -n 120 build/CMakeFiles/CMakeError.log || true; exit 1; }
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" -- -k 0 2>&1 | tee build-make.log
      - name: Verify Mach-O is armv7
        run: |
          file build/CommandConquer || true
          "$THEOS"/toolchain/linux/iphone/bin/*otool* -hv build/CommandConquer | head || true
      - name: Package IPA (no game data inside)
        run: ios-legacy/scripts/package_ios.sh build build/out
      - uses: actions/upload-artifact@v4
        with: { name: CnC-armv7-iOS7-ipa, path: build/out/CommandConquer.ipa, if-no-files-found: error }
      - name: Package .deb (jailbreak)
        run: |
          set -euo pipefail
          D=build/out/deb; rm -rf "$D"; mkdir -p "$D/DEBIAN" "$D/Applications"
          cp -a build/out/Payload/CommandConquer.app "$D/Applications/"
          chmod 755 "$D/Applications/CommandConquer.app/CommandConquer"
          printf 'Package: com.cncport.cnc.armv7\nName: Command & Conquer (armv7)\nVersion: 0.1.0\nArchitecture: iphoneos-arm\nDescription: C&C Tiberian Dawn source port for iOS 7+ armv7\nMaintainer: cnc-port\nSection: Games\nDepends: firmware (>= 7.0)\n' > "$D/DEBIAN/control"
          printf '#!/bin/sh\n(uicache -p /Applications/CommandConquer.app || uicache) >/dev/null 2>&1 || true\nexit 0\n' > "$D/DEBIAN/postinst"
          chmod 755 "$D/DEBIAN/postinst"
          dpkg-deb --root-owner-group -Zgzip -b "$D" build/out/CommandConquer_0.1.0_iphoneos-arm.deb
      - uses: actions/upload-artifact@v4
        with: { name: CnC-armv7-iOS7-deb, path: build/out/CommandConquer_0.1.0_iphoneos-arm.deb, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: "build-*.log", if-no-files-found: ignore }
