          #!/usr/bin/env bash
          # Usage: package_ios.sh <build-dir> [out-dir] [--assets DIR]
          # -> <out>/CommandConquer.ipa (ldid fake-signed; for jailbroken / sideloaded iOS 7+ armv7 devices)
          # --assets DIR  bundles DIR as app/assets/cnc (needs gdi/INSTALL/CONQUER.INI inside). Large! Without it,
          #               copy the data into the app's Documents folder instead (see README).
          set -euo pipefail
          B="${1:?build dir}"; shift
          OUT="$B/out"; ASSETS=""
          if [ $# -gt 0 ] && [ "${1#--}" = "$1" ]; then OUT="$1"; shift; fi
          while [ $# -gt 0 ]; do case "$1" in --assets) ASSETS="${2:?}"; shift 2;; *) echo "bad arg $1"; exit 2;; esac; done
          R="$(cd "$(dirname "$0")/.." && pwd)"
          BIN="$B/CommandConquer"; [ -f "$BIN" ] || { echo "no $BIN"; exit 1; }
          rm -rf "$OUT/Payload"; APP="$OUT/Payload/CommandConquer.app"; mkdir -p "$APP"
          cp "$BIN" "$APP/CommandConquer"
          cp "$R/resources/Info.plist" "$APP/"
          find "$R/resources" -maxdepth 1 -name '*.png' -exec cp {} "$APP/" \;
          if [ -n "$ASSETS" ]; then
            [ -f "$ASSETS/gdi/INSTALL/CONQUER.INI" ] || { echo "$ASSETS/gdi/INSTALL/CONQUER.INI missing"; exit 1; }
            mkdir -p "$APP/assets"; cp -r "$ASSETS" "$APP/assets/cnc"
