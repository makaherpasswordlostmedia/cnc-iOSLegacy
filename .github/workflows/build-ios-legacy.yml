          #!/usr/bin/env python3
          """Generate placeholder icons and black launch images (pure stdlib). Run once; PNGs are committed."""
          import struct, zlib, sys, os
          def png(path, w, h, px):
              raw = b"".join(b"\x00" + b"".join(bytes(px(x, y)) for x in range(w)) for y in range(h))
              def ch(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              open(path, "wb").write(b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw, 9)) + ch(b"IEND", b""))
          def icon(s):
              def px(x, y):
                  b = max(1, s // 16)
                  if x < b or y < b or x >= s - b or y >= s - b: return (200, 160, 40)
                  if s * 3 // 8 < y < s * 5 // 8 and s // 6 < x < s * 5 // 6: return (200, 160, 40)   # gold bar
                  return (30 + 60 * y // s, 12, 12)
              return px
          out = sys.argv[1]
          for n, s in (("Icon-60@2x.png", 120), ("Icon-76.png", 76), ("Icon-76@2x.png", 152)):
              png(os.path.join(out, n), s, s, icon(s))
          black = lambda x, y: (0, 0, 0)
          for n, w, h in (("Default@2x.png", 640, 960), ("Default-568h@2x.png", 640, 1136),
                          ("Default-Landscape~ipad.png", 1024, 748), ("Default-Landscape@2x~ipad.png", 2048, 1496)):
              png(os.path.join(out, n), w, h, black)
          EOF_FILE_11
          cat > ios-legacy/scripts/case_mirror.py <<'EOF_FILE_12'
          #!/usr/bin/env python3
          """Case-insensitive view of the source tree for case-sensitive hosts (Linux CI).
          The code base was written for case-insensitive file systems ("#include <Function.H>" -> FUNCTION.H).
          Usage: case_mirror.py <repo-root> <out-dir>
          Creates <out-dir>/<TOP>/... mirroring CODE WIN32LIB WWFLAT32 WINVQ VQ PORT with symlinks under every
          case variant of each file and directory name (original, lower, upper, name-lower+EXT-upper, ...)."""
          import os, shutil, sys
          repo, out = sys.argv[1], sys.argv[2]
          TOP = ("CODE", "WIN32LIB", "WWFLAT32", "WINVQ", "VQ", "PORT")
          def variants(n):
              b, e = os.path.splitext(n)
              return {n, n.lower(), n.upper(), b.lower() + e.upper(), b.upper() + e.lower()}
          def mirror(src, dst):
              os.makedirs(dst, exist_ok=True)
              for n in sorted(os.listdir(src)):
                  p = os.path.join(src, n)
                  if os.path.isdir(p):
                      sub = os.path.join(dst, n)
                      mirror(p, sub)
                      for v in (n.lower(), n.upper()):
                          q = os.path.join(dst, v)
                          if not os.path.lexists(q):
                              os.symlink(sub, q)
                  else:
                      for v in variants(n):
                          q = os.path.join(dst, v)
                          if not os.path.lexists(q):
                              os.symlink(p, q)
          shutil.rmtree(out, ignore_errors=True)
          for t in TOP:
              if os.path.isdir(os.path.join(repo, t)):
                  mirror(os.path.join(repo, t), os.path.join(out, t))
          print("case mirror ready:", out)
          EOF_FILE_12
