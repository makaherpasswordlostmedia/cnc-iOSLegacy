name: Build C&C (iOS 7+ armv7)
# Self-contained: this single file generates everything under ios-legacy/ and patches PORT/IOS/src/ios_main.cpp.
# Just drop it into .github/workflows/ of the C&C repo and run it (Actions -> Run workflow).
on: workflow_dispatch
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl zip unzip xz-utils bzip2 git patch
      - name: Generate ios-legacy files + patch ios_main.cpp
        run: |
          set -euo pipefail
          mkdir -p ios-legacy/cmake ios-legacy/patches ios-legacy/host ios-legacy/resources ios-legacy/scripts
          cat > ios-legacy/CMakeLists.txt <<'EOF_FILE_0'
          # Command & Conquer: Tiberian Dawn - iOS 7+ / armv7 (32-bit) build.
          # Cross-compiled from Linux with the Theos LLVM toolchain + iPhoneOS 9.3 SDK, no Xcode needed.
          #   cmake -S ios-legacy -B build-legacy -G Ninja \
          #         -DCMAKE_TOOLCHAIN_FILE=ios-legacy/cmake/ios-armv7-toolchain.cmake
          # SDL2 must be fetched+patched first: ios-legacy/scripts/fetch_sdl.sh
          cmake_minimum_required(VERSION 3.20)
          project(cnc_ios_legacy C CXX OBJC OBJCXX)

          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_CREATE_STATIC_LIBRARY "<CMAKE_AR> qc <TARGET> <LINK_FLAGS> <OBJECTS>" "<CMAKE_RANLIB> <TARGET>")
          endforeach()

          # The code base uses static_assert (C++11). Pin it: an un-flagged 'standard 98' would silently fall back to the
          # compiler default (gnu++17), which the 2015-era libc++ headers of the iPhoneOS 9.3 SDK are not meant for.
          set(CMAKE_CXX_STANDARD 11)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS ON)
          set(CMAKE_POSITION_INDEPENDENT_CODE OFF)
          set(CMAKE_BUILD_TYPE Release CACHE STRING "")

          set(SDL_DIR "${CMAKE_CURRENT_LIST_DIR}/third_party/SDL")
          if(NOT EXISTS "${SDL_DIR}/CMakeLists.txt")
            message(FATAL_ERROR "Missing ${SDL_DIR}. Run ios-legacy/scripts/fetch_sdl.sh first.")
          endif()

          # ---- SDL2: UIKit + OpenGL ES 2 + CoreAudio, static. No Metal (A5/A6 and iOS 7 have none).
          set(SDL_SHARED OFF CACHE BOOL "" FORCE)
          set(SDL_STATIC ON  CACHE BOOL "" FORCE)
          set(SDL_TEST OFF CACHE BOOL "" FORCE)
          set(SDL_TESTS OFF CACHE BOOL "" FORCE)
          set(SDL_INSTALL OFF CACHE BOOL "" FORCE)
          set(SDL2_DISABLE_INSTALL ON CACHE BOOL "" FORCE)
          set(SDL_METAL OFF CACHE BOOL "" FORCE)
          set(SDL_RENDER_METAL OFF CACHE BOOL "" FORCE)
          set(SDL_VULKAN OFF CACHE BOOL "" FORCE)
          set(SDL_HAPTIC OFF CACHE BOOL "" FORCE)
          set(SDL_HIDAPI OFF CACHE BOOL "" FORCE)
          set(SDL_AUDIO ON CACHE BOOL "" FORCE)
          set(SDL_OPENGLES ON CACHE BOOL "" FORCE)
          add_subdirectory("${SDL_DIR}" "${CMAKE_BINARY_DIR}/SDL2" EXCLUDE_FROM_ALL)

          # game sources / defines / include dirs (shared with the mac/android/ios builds)
          include("${CMAKE_CURRENT_LIST_DIR}/../cmake/cnc95_common.cmake")

          # The code base relies on case-insensitive #include / file names; a Linux host is case-sensitive.
          # Build a symlink mirror with all case variants and compile/include everything through it.
          find_program(CNC_HOST_PYTHON NAMES python3 python REQUIRED)
          set(CNC_CM "${CMAKE_BINARY_DIR}/casemirror")
          execute_process(COMMAND "${CNC_HOST_PYTHON}" "${CMAKE_CURRENT_LIST_DIR}/scripts/case_mirror.py" "${CNC95_REPO_ROOT}" "${CNC_CM}"
                          RESULT_VARIABLE _cm_rc)
          if(NOT _cm_rc EQUAL 0)
            message(FATAL_ERROR "case_mirror.py failed")
          endif()
          function(cnc_remap out)
            set(_o)
            foreach(p ${ARGN})
              string(FIND "${p}" "${CNC95_REPO_ROOT}/" _pos)
              if(_pos EQUAL 0)
                string(LENGTH "${CNC95_REPO_ROOT}/" _len)
                string(SUBSTRING "${p}" ${_len} -1 _rel)
                list(APPEND _o "${CNC_CM}/${_rel}")
              else()
                list(APPEND _o "${p}")
              endif()
            endforeach()
            set(${out} "${_o}" PARENT_SCOPE)
          endfunction()

          cnc_remap(CNC_SRCS
              "${CNC95_REPO_ROOT}/PORT/IOS/src/ios_main.cpp"
              ${CNC95_PLATFORM_SDL_SOURCES} ${CNC95_SOURCES} ${CNC95_SUPPORT_SOURCES})
          add_executable(CommandConquer
              "${CMAKE_CURRENT_LIST_DIR}/host/ios_diag.mm"
              "${CMAKE_CURRENT_LIST_DIR}/host/ios_availability_stub.m"
              "${CMAKE_CURRENT_LIST_DIR}/host/libcxx_compat.cpp"
              ${CNC_SRCS})
          cnc95_configure_target(CommandConquer)
          get_target_property(_incs CommandConquer INCLUDE_DIRECTORIES)
          cnc_remap(_incs_cm ${_incs})
          set_target_properties(CommandConquer PROPERTIES INCLUDE_DIRECTORIES "${_incs_cm}")

          target_compile_definitions(CommandConquer PRIVATE RA_IOS RA_IOS_LEGACY RA_MOBILE_TOUCH)
          # 1995 code: do not let the optimizer exploit strict aliasing on type-punned buffers.
          target_compile_options(CommandConquer PRIVATE -fno-strict-aliasing
            $<$<COMPILE_LANGUAGE:CXX>:-std=gnu++11> $<$<COMPILE_LANGUAGE:OBJCXX>:-std=gnu++11>
            # Original Win32 semantics: 32-bit 'long' case labels / char tables with values > LONG_MAX / CHAR_MAX wrap.
            # C++11 makes these hard narrowing errors (e.g. INIT.CPP PARM_* case labels on ILP32).
            $<$<COMPILE_LANGUAGE:CXX>:-Wno-c++11-narrowing>
            # The game does not use C++ exceptions, and the Theos LLVM 19 ARM backend segfaults emitting EH tables
            # for armv7 (EHStreamer::computeCallSiteTable) on INIT.CPP / SAVELOAD.CPP.
            $<$<COMPILE_LANGUAGE:CXX>:-fno-exceptions> $<$<COMPILE_LANGUAGE:OBJCXX>:-fno-exceptions>)
          set_source_files_properties("${CMAKE_CURRENT_LIST_DIR}/host/ios_diag.mm" PROPERTIES COMPILE_OPTIONS "-fobjc-arc")
          target_include_directories(CommandConquer PRIVATE "${SDL_DIR}/include" "${SDL_DIR}/include/SDL2")

          # SDL2main supplies main() -> UIApplicationMain; our SDL_main is in ios_main.cpp.
          target_link_libraries(CommandConquer PRIVATE SDL2main SDL2-static
            "-framework UIKit" "-framework Foundation" "-framework OpenGLES" "-framework QuartzCore"
            "-framework CoreGraphics" "-framework AudioToolbox" "-framework CoreAudio" "-framework CoreMotion"
            "-framework CoreFoundation" "-framework AVFoundation" "-framework CoreVideo" "-framework CoreMedia"
            "-weak_framework GameController" "-Wl,-dead_strip" "-Wl,-map,${CMAKE_BINARY_DIR}/CommandConquer.map" c++)
          EOF_FILE_0
          cat > ios-legacy/cmake/ios-armv7-toolchain.cmake <<'EOF_FILE_1'
          # Toolchain: iOS armv7 (min iOS 7.0) cross-compiled from Linux.
          # Needs: L1ghtmann LLVM iOS toolchain (Theos) + iPhoneOS 9.3 SDK.
          #   IOS_TOOLCHAIN_BIN  = <theos>/toolchain/linux/iphone/bin   (or set THEOS)
          #   IOS_SDK            = <theos>/sdks/iPhoneOS9.3.sdk          (or set THEOS)
          # CMake's own iOS platform module needs an Apple SDK name (fails on Linux): use Darwin and flag IOS ourselves.
          set(CMAKE_SYSTEM_NAME Darwin)
          set(IOS TRUE)
          set(CMAKE_SYSTEM_PROCESSOR armv7)
          set(CMAKE_OSX_ARCHITECTURES armv7 CACHE STRING "" FORCE)

          if(NOT IOS_TOOLCHAIN_BIN)
            if(DEFINED ENV{IOS_TOOLCHAIN_BIN})
              set(IOS_TOOLCHAIN_BIN $ENV{IOS_TOOLCHAIN_BIN})
            elseif(DEFINED ENV{THEOS})
              set(IOS_TOOLCHAIN_BIN $ENV{THEOS}/toolchain/linux/iphone/bin)
            endif()
          endif()
          if(NOT IOS_SDK)
            if(DEFINED ENV{IOS_SDK})
              set(IOS_SDK $ENV{IOS_SDK})
            elseif(DEFINED ENV{THEOS})
              set(IOS_SDK $ENV{THEOS}/sdks/iPhoneOS9.3.sdk)
            endif()
          endif()
          if(NOT IOS_TOOLCHAIN_BIN OR NOT IOS_SDK)
            message(FATAL_ERROR "Set THEOS, or IOS_TOOLCHAIN_BIN and IOS_SDK")
          endif()

          set(CMAKE_SYSROOT ${IOS_SDK})
          set(CMAKE_OSX_SYSROOT ${IOS_SDK} CACHE PATH "" FORCE)
          set(CMAKE_C_COMPILER   ${IOS_TOOLCHAIN_BIN}/clang)
          set(CMAKE_CXX_COMPILER ${IOS_TOOLCHAIN_BIN}/clang++)
          set(CMAKE_OBJC_COMPILER   ${IOS_TOOLCHAIN_BIN}/clang)
          set(CMAKE_OBJCXX_COMPILER ${IOS_TOOLCHAIN_BIN}/clang++)
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_COMPILER_WORKS TRUE)
            set(CMAKE_${L}_COMPILER_TARGET armv7-apple-ios7.0)
          endforeach()
          find_program(IOS_AR     NAMES llvm-ar ar         HINTS ${IOS_TOOLCHAIN_BIN} NO_DEFAULT_PATH)
          find_program(IOS_RANLIB NAMES llvm-ranlib ranlib HINTS ${IOS_TOOLCHAIN_BIN} NO_DEFAULT_PATH)
          find_program(IOS_AR     NAMES llvm-ar ar)
          find_program(IOS_RANLIB NAMES llvm-ranlib ranlib)
          set(CMAKE_AR ${IOS_AR} CACHE FILEPATH "" FORCE)
          set(CMAKE_RANLIB ${IOS_RANLIB} CACHE FILEPATH "" FORCE)

          # Optional: ld64 (cctools-port / ld64.lld) if clang can't find the linker itself.
          if(DEFINED ENV{IOS_LD})
            set(_ld "-fuse-ld=$ENV{IOS_LD}")
          endif()

          # 9.3 SDK module maps confuse modern clang.
          set(_common "-arch armv7 -miphoneos-version-min=7.0 -isysroot ${IOS_SDK} -fno-modules -fno-implicit-modules -fno-implicit-module-maps -Wno-deprecated-declarations -Wno-error")
          set(CMAKE_C_FLAGS_INIT   "${_common}")
          # Toolchain's libc++ 19 headers lack __config_site; use the SDK's own libc++ headers (match the SDK's libc++.dylib).
          set(_cxxinc "")
          if(EXISTS ${IOS_SDK}/usr/include/c++/v1)
            set(_cxxinc "-nostdinc++ -isystem ${IOS_SDK}/usr/include/c++/v1")
          endif()
          set(CMAKE_CXX_FLAGS_INIT "${_common} -stdlib=libc++ ${_cxxinc}")
          set(CMAKE_OBJC_FLAGS_INIT   "${_common}")
          set(CMAKE_OBJCXX_FLAGS_INIT "${_common} -stdlib=libc++ ${_cxxinc}")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-arch armv7 -miphoneos-version-min=7.0 -isysroot ${IOS_SDK} ${_ld}")
          # Platform/Darwin.cmake forces libtool for static libs (absent on Linux) and overwrites anything set here,
          # which made EVERY try_compile (check_function_exists, pthreads, ...) fail. A rules override is loaded after
          # the platform module and is propagated into try_compile projects, so use plain ar+ranlib there.
          set(CMAKE_USER_MAKE_RULES_OVERRIDE ${CMAKE_CURRENT_LIST_DIR}/ios-rules-override.cmake)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_FIND_ROOT_PATH ${IOS_SDK})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          EOF_FILE_1
          cat > ios-legacy/cmake/ios-rules-override.cmake <<'EOF_FILE_2'
          foreach(L C CXX OBJC OBJCXX)
            set(CMAKE_${L}_CREATE_STATIC_LIBRARY "<CMAKE_AR> qc <TARGET> <LINK_FLAGS> <OBJECTS>" "<CMAKE_RANLIB> <TARGET>")
          endforeach()
          EOF_FILE_2
          cat > ios-legacy/patches/sdl2-ios7.patch <<'EOF_FILE_3'
          diff -ruN a/CMakeLists.txt b/CMakeLists.txt
          --- a/CMakeLists.txt	2026-11-10 05:41:22.490892773 +0000
          +++ b/CMakeLists.txt	2026-11-10 05:41:22.495429990 +0000
          @@ -2095,7 +2095,7 @@
