          #!/usr/bin/env python3
          """Adds start-up diagnostics to PORT/IOS/src/ios_main.cpp (idempotent): logs the chosen working directory,
          whether the game data (config_path) was found, and the hand-off to WinMain."""
          p = "PORT/IOS/src/ios_main.cpp"
          t = open(p).read()
          AUDIT = r'''
          static void audit_data(void)
          {
          	/* log what is really on disk: marker files + a listing of the data folders */
          	static char const *const files[] = {
          		"assets/cnc/gdi/INSTALL/CONQUER.INI", "assets/cnc/gdi/INSTALL/CCLOCAL.MIX", "assets/cnc/gdi/INSTALL/UPDATE.MIX",
          		"assets/cnc/gdi/CONQUER.MIX", "assets/cnc/gdi/GENERAL.MIX", "assets/cnc/gdi/SOUNDS.MIX", "assets/cnc/gdi/SCORES.MIX",
          		"assets/cnc/gdi/MOVIES.MIX", "assets/cnc/gdi/TRANSIT.MIX", "assets/cnc/gdi/SPEECH.MIX", 0 };
          	for (int i = 0; files[i]; ++i) {
          		struct stat info;
          		if (stat(files[i], &info) == 0) SDL_Log("audit: %-40s %lld bytes", files[i], (long long)info.st_size);
          		else SDL_Log("audit: %-40s MISSING (errno=%d)", files[i], errno);
          	}
          	static char const *const dirs[] = { "assets", "assets/cnc", "assets/cnc/gdi", "assets/cnc/gdi/INSTALL", 0 };
          	for (int i = 0; dirs[i]; ++i) {
          		DIR *d = opendir(dirs[i]);
          		if (!d) { SDL_Log("audit: dir %s: cannot open (errno=%d)", dirs[i], errno); continue; }
          		std::string list; int n = 0; struct dirent *e;
          		while ((e = readdir(d)) != 0 && n < 60) {
          			if (e->d_name[0] == '.') continue;
          			list += e->d_name; list += ' '; ++n;
          		}
          		closedir(d);
          		SDL_Log("audit: dir %s: %s", dirs[i], list.c_str());
          	}
          }
          '''
          if "ios_main: cwd" not in t:
              anchor = 'extern "C" int SDL_main('
              assert anchor in t
              t = t.replace(anchor, AUDIT + "\n" + anchor, 1)
              old = "\tselect_resource_root();\n\n\tstd::string command_line;"
              assert old in t, "SDL_main anchor not found"
              new = (
                  "\tselect_resource_root();\n"
                  "\t{\n"
                  "\t\tchar cwd[1024];\n"
                  "\t\tif (!getcwd(cwd, sizeof(cwd))) { cwd[0] = '?'; cwd[1] = 0; }\n"
                  "\t\tSDL_Log(\"ios_main: cwd=%s\", cwd);\n"
                  "\t\tSDL_Log(\"ios_main: data %s = %s\", config_path(), path_exists(config_path()) ? \"FOUND\" : \"MISSING\");\n"
                  "\t\taudit_data();\n"
                  "\t\tSDL_Log(\"ios_main: entering WinMain\");\n"
                  "\t}\n\n"
                  "\tstd::string command_line;"
              )
              t = t.replace(old, new, 1)
              open(p, "w").write(t)
          print("ios_main.cpp start-up logging ok")
          EOF_FILE_13
          chmod +x ios-legacy/scripts/*.sh ios-legacy/scripts/*.py
          python3 -I ios-legacy/scripts/gen_resources.py ios-legacy/resources
          python3 - <<'EOF_PY'
