          if [ -n "$LDID" ]; then "$LDID" -S"$R/resources/entitlements.plist" "$APP/CommandConquer"; else echo "warning: ldid not found, binary unsigned"; fi
          (cd "$OUT" && rm -f CommandConquer.ipa && zip -qr CommandConquer.ipa Payload)
