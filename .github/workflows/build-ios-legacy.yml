                               return NO;
          diff -ruN a/src/joystick/SDL_joystick.c b/src/joystick/SDL_joystick.c
          --- a/src/joystick/SDL_joystick.c	2026-11-10 05:41:22.274892760 +0000
          +++ b/src/joystick/SDL_joystick.c	2026-11-10 05:41:22.338892764 +0000
          @@ -73,9 +73,6 @@
           #ifdef SDL_JOYSTICK_IOKIT
               &SDL_DARWIN_JoystickDriver,
