                 endif()
          @@ -2350,7 +2351,7 @@
             endif()
             if(SDL_FRAMEWORK_COREMOTION)
               list(APPEND PKGCONFIG_LDFLAGS "-Wl,-framework,CoreMotion")
          -    list(APPEND CMAKE_LIBS "$<LINK_LIBRARY:FRAMEWORK,Coremotion>")
          +    list(APPEND CMAKE_LIBS "$<LINK_LIBRARY:FRAMEWORK,CoreMotion>")
             endif()
             if(SDL_FRAMEWORK_FOUNDATION)
               list(APPEND PKGCONFIG_LDFLAGS "-Wl,-framework,Foundation")
          diff -ruN a/src/audio/coreaudio/SDL_coreaudio.m b/src/audio/coreaudio/SDL_coreaudio.m
          --- a/src/audio/coreaudio/SDL_coreaudio.m	2026-11-10 05:41:22.501202592 +0000
          +++ b/src/audio/coreaudio/SDL_coreaudio.m	2026-11-10 10:46:57.243164976 +0000
          @@ -418,22 +418,22 @@
                       options |= 0x4; /* AVAudioSessionCategoryOptionAllowBluetooth; */
                   }
