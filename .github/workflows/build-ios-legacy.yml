          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          curl -fsSL -o /tmp/sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            [ -f "$fw/module.map" ] && { mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; }
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done
          TB="$THEOS/toolchain/linux/iphone/bin"
          [ -e "$TB/aarch64-apple-darwin14-ranlib" ] || ln -sf "$TB/llvm-ranlib" "$TB/aarch64-apple-darwin14-ranlib" 2>/dev/null || true
          # toolchain libc++ 19 headers need a __config_site (the SDK 9.3 tarball has no libc++ headers)
          CS="$TB/../include/c++/v1/__config_site"
          if [ -d "$SDK/usr/include/c++/v1" ]; then echo "SDK libc++ headers: ok"
          elif [ ! -f "$CS" ]; then
            FOUND="$(find "$THEOS/toolchain" -name '__config_site' 2>/dev/null | head -n1)"
            if [ -n "$FOUND" ]; then cp "$FOUND" "$CS"; else
              cat > "$CS" <<'EOF_CS'
          #ifndef _LIBCPP_CONFIG_SITE
          #define _LIBCPP_CONFIG_SITE
          #define _LIBCPP_ABI_VERSION 1
          #define _LIBCPP_ABI_NAMESPACE __1
          #define _LIBCPP_HAS_THREAD_API_PTHREAD 1
          #define _LIBCPP_HARDENING_MODE_DEFAULT _LIBCPP_HARDENING_MODE_NONE
          #define _LIBCPP_PSTL_BACKEND_SERIAL 1
          #endif
          EOF_CS
            fi
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Fetch + patch SDL2
        run: ios-legacy/scripts/fetch_sdl.sh
      - name: Configure
        run: |
          set -o pipefail
          command -v ninja && ninja --version
          # absolute path: with -S ios-legacy a relative toolchain path is resolved inside ios-legacy/
          cmake -S "$GITHUB_WORKSPACE/ios-legacy" -B "$GITHUB_WORKSPACE/build" -G Ninja -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-legacy/cmake/ios-armv7-toolchain.cmake" 2>&1 | tee build-configure.log || {
            tail -n 120 build/CMakeFiles/CMakeError.log || true; exit 1; }
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" -- -k 0 2>&1 | tee build-make.log
          cp build/CommandConquer.map build-link-map.log 2>/dev/null || true
      - name: Verify Mach-O is armv7
        run: |
          file build/CommandConquer || true
          "$THEOS"/toolchain/linux/iphone/bin/*otool* -hv build/CommandConquer | head || true
      - name: Package IPA (no game data inside)
        run: ios-legacy/scripts/package_ios.sh build build/out
      - uses: actions/upload-artifact@v4
        with: { name: CnC-armv7-iOS7-ipa, path: build/out/CommandConquer.ipa, if-no-files-found: error }
      - name: Package .deb (jailbreak)
        run: |
          set -euo pipefail
          D=build/out/deb; rm -rf "$D"; mkdir -p "$D/DEBIAN" "$D/Applications"
          cp -a build/out/Payload/CommandConquer.app "$D/Applications/"
          chmod 755 "$D/Applications/CommandConquer.app/CommandConquer"
          printf 'Package: com.cncport.cnc.armv7\nName: Command & Conquer (armv7)\nVersion: 0.1.0\nArchitecture: iphoneos-arm\nDescription: C&C Tiberian Dawn source port for iOS 7+ armv7\nMaintainer: cnc-port\nSection: Games\nDepends: firmware (>= 7.0)\n' > "$D/DEBIAN/control"
          printf '#!/bin/sh\n(uicache -p /Applications/CommandConquer.app || uicache) >/dev/null 2>&1 || true\nexit 0\n' > "$D/DEBIAN/postinst"
          chmod 755 "$D/DEBIAN/postinst"
          dpkg-deb --root-owner-group -Zgzip -b "$D" build/out/CommandConquer_0.1.0_iphoneos-arm.deb
      - uses: actions/upload-artifact@v4
        with: { name: CnC-armv7-iOS7-deb, path: build/out/CommandConquer_0.1.0_iphoneos-arm.deb, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: "build-*.log", if-no-files-found: ignore }
