               /* Integer truncation of fractional values matches SDL_uikitmetalview and
          EOF_FILE_3
          cat > ios-legacy/host/ios_diag.mm <<'EOF_FILE_4'
          // ios_diag.mm - persistent log + crash/exception diagnostics for the iOS 7+ armv7 build.
          // Everything goes to <App>/Documents/cnc_ios.log (visible via iTunes file sharing / SSH):
          // SDL_Log output, fatal signals with a backtrace, uncaught NSException / std::terminate, heartbeat.
          // Adapted from the Unreal iOS legacy port.
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <SDL.h>
          #include <execinfo.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>
          #include <errno.h>
          #include <exception>
          #include <dlfcn.h>
          #include <mach-o/dyld.h>

          static int GFd = -1;
          static pthread_mutex_t GLock = PTHREAD_MUTEX_INITIALIZER;
          static char GLast[256] = "(nothing logged yet)";
          static char GPath[1100];

          static void RawWrite(const char *s)
          {
          	if (GFd < 0 || !s) return;
          	size_t n = strlen(s);
          	while (n) {
          		ssize_t w = write(GFd, s, n);
          		if (w <= 0) break;
          		s += w; n -= (size_t)w;
          	}
          }

          static void EnsureOpen(void)
          {
          	if (GFd >= 0) return;
          	const char *home = getenv("HOME");
          	snprintf(GPath, sizeof(GPath), "%s/Documents/cnc_ios.log", home ? home : ".");
          	GFd = open(GPath, O_WRONLY | O_CREAT | O_APPEND, 0644);
          }

          static void LogLine(const char *msg, bool update_last)
          {
          	if (!msg) return;
          	pthread_mutex_lock(&GLock);
          	EnsureOpen();
          	char line[1400], ts[16];
          	time_t now = time(NULL); struct tm tmv; localtime_r(&now, &tmv);
          	strftime(ts, sizeof(ts), "%H:%M:%S", &tmv);
          	snprintf(line, sizeof(line), "[%s] %.1300s\n", ts, msg);
          	RawWrite(line);
          	if (update_last) strlcpy(GLast, msg, sizeof(GLast));
          	pthread_mutex_unlock(&GLock);
          }

          static void CrashHandler(int sig, siginfo_t *si, void *)
          {
          	char b[400];
          	snprintf(b, sizeof(b), "\n*** CRASH: signal %d (%s) fault addr=%p\n*** last log line: %s\n",
          		sig, strsignal(sig), si ? si->si_addr : NULL, GLast);
          	RawWrite(b);
          	void *bt[64]; int n = backtrace(bt, 64);
          	if (GFd >= 0) backtrace_symbols_fd(bt, n, GFd);
          	RawWrite("*** end of crash report\n");
          	signal(sig, SIG_DFL);
          	raise(sig);
          }

          // No try/catch here on purpose: the Theos LLVM 19 backend crashes while emitting armv7 EH tables
          // (EHStreamer::computeCallSiteTable), so the whole target is built with -fno-exceptions.
          static void TerminateHandler(void)
          {
          	static int busy = 0;
          	if (!busy) {
          		busy = 1;
          		char m[400];
          		snprintf(m, sizeof(m), "*** std::terminate called | last log line: %s", GLast);
          		LogLine(m, false);
          		void *bt[64]; int n = backtrace(bt, 64);
          		if (GFd >= 0) backtrace_symbols_fd(bt, n, GFd);
          	}
          	abort();
          }

          static void ObjCExceptionHandler(NSException *e)
          {
          	NSString *s = [NSString stringWithFormat:@"*** Uncaught NSException %@: %@\n%@", e.name, e.reason, [e callStackSymbols]];
          	LogLine([s UTF8String], false);
          }

          static void SDLCALL SDLLogCB(void *, int cat, SDL_LogPriority pri, const char *msg)
          {
          	char b[1100];
          	snprintf(b, sizeof(b), "SDL[cat=%d pri=%d]: %s", cat, (int)pri, msg ? msg : "");
          	LogLine(b, true);
          }


          static pthread_t GMainThread;
          static volatile time_t GLastChange = 0;

          static void DumpBacktrace(const char *title)
          {
          	void *bt[48]; int n = backtrace(bt, 48);
          	char b[400];
          	snprintf(b, sizeof(b), "%s (image base=%p slide=0x%lx)", title,
          		(void *)_dyld_get_image_header(0), (long)_dyld_get_image_vmaddr_slide(0));
          	RawWrite(b); RawWrite("\n");
          	for (int i = 0; i < n; i++) {
          		Dl_info di; memset(&di, 0, sizeof(di));
          		if (dladdr(bt[i], &di) && di.dli_sname)
          			snprintf(b, sizeof(b), "   #%d %p %s+%ld (%s)\n", i, bt[i], di.dli_sname,
          				(long)((char *)bt[i] - (char *)di.dli_saddr), di.dli_fname ? strrchr(di.dli_fname, '/') ? strrchr(di.dli_fname, '/') + 1 : di.dli_fname : "?");
          		else
          			snprintf(b, sizeof(b), "   #%d %p (file offset 0x%lx)\n", i, bt[i],
          				(long)((char *)bt[i] - (char *)_dyld_get_image_header(0)));
          		RawWrite(b);
          	}
          }

          // SIGUSR2 is delivered to the main thread when the log has been silent for a while: shows where it is stuck.
          static void StackSampleHandler(int)
          {
          	DumpBacktrace("--- main thread stack sample ---");
          }

          // stderr/stdout of the game go through a pipe so every line gets a timestamp and updates "last log line".
          static int GPipe[2] = { -1, -1 };
          static void *PipeThread(void *)
          {
          	char buf[2048]; size_t len = 0;
          	for (;;) {
          		ssize_t r = read(GPipe[0], buf + len, sizeof(buf) - 1 - len);
          		if (r <= 0) { if (r < 0 && errno == EINTR) continue; break; }
          		len += (size_t)r;
          		buf[len] = 0;
          		char *start = buf, *nl;
          		while ((nl = strchr(start, '\n')) != NULL) {
          			*nl = 0;
          			char *e = nl; while (e > start && e[-1] == '\r') *--e = 0;
          			if (*start) { char m[1300]; snprintf(m, sizeof(m), "game: %s", start); LogLine(m, true); GLastChange = time(NULL); }
          			start = nl + 1;
          		}
          		len = strlen(start);
          		if (len >= sizeof(buf) - 1) { LogLine(start, true); len = 0; }
          		memmove(buf, start, len);
          	}
          	return NULL;
          }

          static void *HeartbeatThread(void *)
          {
          	int t = 0;
          	for (;;) {
          		sleep(t < 60 ? 5 : 30);
          		t += (t < 60 ? 5 : 30);
          		char b[400];
          		snprintf(b, sizeof(b), "heartbeat +%ds | last log line: %s", t, GLast);
          		LogLine(b, false);
          		// no new log line for 10s+ -> sample the main thread (repeat every other beat)
          		if (t >= 10 && (t % 10 == 0 || t > 60)) pthread_kill(GMainThread, SIGUSR2);
          	}
          	return NULL;
          }

          __attribute__((constructor)) static void CncIOSDiagInit(void)
          {
          	@autoreleasepool {
          		char h[300];
          		snprintf(h, sizeof(h), "\n==== C&C iOS legacy launch | build %s %s | iOS %s | %s ====",
          			__DATE__, __TIME__, [[[UIDevice currentDevice] systemVersion] UTF8String],
          			[[[UIDevice currentDevice] model] UTF8String]);
          		LogLine(h, true);
          	}
          	static char altstack[64 * 1024];
          	stack_t ss; ss.ss_sp = altstack; ss.ss_size = sizeof(altstack); ss.ss_flags = 0;
          	sigaltstack(&ss, NULL);
          	struct sigaction sa; memset(&sa, 0, sizeof(sa));
          	sa.sa_sigaction = CrashHandler;
          	sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESETHAND;
          	sigemptyset(&sa.sa_mask);
          	const int sigs[] = { SIGSEGV, SIGBUS, SIGILL, SIGABRT, SIGFPE, SIGTRAP };
          	for (size_t i = 0; i < sizeof(sigs) / sizeof(sigs[0]); i++) sigaction(sigs[i], &sa, NULL);
          	std::set_terminate(TerminateHandler);
          	NSSetUncaughtExceptionHandler(&ObjCExceptionHandler);
          	SDL_LogSetAllPriority(SDL_LOG_PRIORITY_INFO);
          	SDL_LogSetOutputFunction(SDLLogCB, NULL);
          	GMainThread = pthread_self();
          	struct sigaction su; memset(&su, 0, sizeof(su));
          	su.sa_handler = StackSampleHandler; su.sa_flags = SA_ONSTACK; sigemptyset(&su.sa_mask);
          	sigaction(SIGUSR2, &su, NULL);
          	pthread_t th;
          	if (pthread_create(&th, NULL, HeartbeatThread, NULL) == 0) pthread_detach(th);
          	// The game prints via fprintf(stderr) (OutputDebugString / CCDebugString): capture all of it in the log.
          	EnsureOpen();
          	if (pipe(GPipe) == 0) {
          		dup2(GPipe[1], STDERR_FILENO);
          		dup2(GPipe[1], STDOUT_FILENO);
          		setvbuf(stdout, NULL, _IONBF, 0);
          		setvbuf(stderr, NULL, _IONBF, 0);
          		pthread_t pt;
          		if (pthread_create(&pt, NULL, PipeThread, NULL) == 0) pthread_detach(pt);
          	} else if (GFd >= 0) {
          		dup2(GFd, STDERR_FILENO);
          		dup2(GFd, STDOUT_FILENO);
          	}
          	{
          		char e[600];
          		snprintf(e, sizeof(e), "env: HOME=%s | main image base=%p slide=0x%lx | pid=%d",
          			getenv("HOME") ? getenv("HOME") : "(null)", (void *)_dyld_get_image_header(0),
          			(long)_dyld_get_image_vmaddr_slide(0), (int)getpid());
          		LogLine(e, false);
          	}
          	LogLine("diag: crash/exception/SDL handlers, stderr capture, stall sampler installed", true);
          }
          EOF_FILE_4
          cat > ios-legacy/host/ios_availability_stub.m <<'EOF_FILE_5'
          /*
           * ___isPlatformVersionAtLeast is a compiler-rt builtin clang emits for
           * @available(...)/API_AVAILABLE checks. This toolchain's prebuilt
           * libSDL2.a was compiled against a clang that assumes it's always
           * present at link time (normally supplied by Apple's compiler-rt on a
           * real Xcode toolchain), but this bare Linux->iOS cross-toolchain
           * doesn't ship a compiler-rt archive at all - so the symbol is simply
           * never linked in.
           *
           * Both call sites that need it (SDL_HideHomeIndicatorHintChanged and
           * UIKit_ShowMessageBoxAlertController, both in SDL2's UIKit backend)
           * only use it to guard iOS 11+/13+ API calls. Since this whole build
           * targets iPhoneOS 9.3, any real OS this binary ever runs on that is
           * newer than 9.3 should still report "yes, at least" for those
           * checks correctly - so a full platform/version parser isn't needed,
           * just something that answers consistently with the real runtime
           * version already available via -[UIDevice systemVersion].
           *
           * Clang's ABI for this builtin (see clang/lib/CodeGen/CGObjC.cpp,
           * EmitAvailabilityCheck): int32_t platform, then three components
           * (major, minor, subminor) of the version being checked against.
           * Returning 1 when the running OS's version >= the requested version
           * matches real semantics; the SDL call sites already gate their own
           * logic on this, so this stub just needs to answer correctly rather
           * than unconditionally return true.
           */
          #import <UIKit/UIKit.h>

          int32_t __isPlatformVersionAtLeast(int32_t platform, int32_t major, int32_t minor, int32_t subminor) {
              (void)platform; /* single-platform (iOS) build; ignore platform id */

              NSString *sysVersion = [[UIDevice currentDevice] systemVersion];
              NSArray<NSString *> *parts = [sysVersion componentsSeparatedByString:@"."];

              int32_t runningMajor = parts.count > 0 ? [parts[0] intValue] : 0;
              int32_t runningMinor = parts.count > 1 ? [parts[1] intValue] : 0;
              int32_t runningSubminor = parts.count > 2 ? [parts[2] intValue] : 0;

              if (runningMajor != major) return runningMajor > major;
              if (runningMinor != minor) return runningMinor > minor;
              return runningSubminor >= subminor;
          }
          EOF_FILE_5
          cat > ios-legacy/host/libcxx_compat.cpp <<'EOF_FILE_6'
          // libc++ 19 headers (Theos toolchain) call std::__libcpp_verbose_abort() from inline helpers such as
          // __throw_length_error / __throw_bad_array_new_length. It lives in libc++ >= 15, but the iPhoneOS 9.3 SDK
          // libc++.dylib (the one that actually ships on iOS 7-9) does not have it, so provide it here.
          // Deliberately includes no libc++ header: the declaration there is noexcept/availability-annotated.
          #include <stdarg.h>
          #include <stdio.h>

          extern "C" void abort(void) __attribute__((noreturn));

          namespace std {
          inline namespace __1 {
          __attribute__((noreturn, visibility("default")))
          void __libcpp_verbose_abort(const char *format, ...) noexcept
          {
          	va_list ap;
          	va_start(ap, format);
          	fputs("libc++ abort: ", stderr);
          	vfprintf(stderr, format, ap);
          	va_end(ap);
          	abort();
          }
          } // namespace __1
          } // namespace std
